name: Rewrite All Blog Posts

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Rewrite all posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python rewrite_posts.py

      - name: Commit and push
        run: |
          git config user.name "Sober Adventuring Bot"
          git config user.email "bot@soberadventuring.com"
          git add blog/
          git diff --staged --quiet || git commit -m "Rewrite: all posts updated — Sonnet model + full writing rules"
          git push
